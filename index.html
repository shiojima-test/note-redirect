<!DOCTYPE html>
<!-- note-redirect v1.2 (2026-06-27): PLAUD分岐にタイトルコピー＋アプリ内検索誘導を追加 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開く (note-redirect v1.2)</title>
  <style>
    body { font-family: -apple-system, 'Meiryo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f7; }
    .container { text-align: center; padding: 40px; }
    .btn { display: inline-block; padding: 16px 40px; font-size: 18px; color: white; background: #007AFF; border-radius: 12px; text-decoration: none; margin: 20px 0; }
    .btn:active { background: #005EC4; }
    .btn.plaud { background: #E88A0A; }
    .btn.plaud:active { background: #c5740a; }
    p { color: #666; font-size: 14px; }
    .sub { font-size: 12px; }
    .sub a { color: #2E8EC4; }
    .ver { position: fixed; bottom: 8px; right: 10px; color: #bbb; font-size: 11px; }
  </style>
</head>
<body>
  <div class="container">
    <p id="icon">📝</p>
    <a id="openBtn" class="btn" href="#">開く</a>
    <p id="desc">タップして開きます</p>
    <p class="sub" id="sub"></p>
  </div>
  <div class="ver">v1.2</div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var scheme = params.get('scheme');
    var btn = document.getElementById('openBtn');
    var desc = document.getElementById('desc');
    var sub = document.getElementById('sub');

    if (scheme === 'craft') {
      // ===== Craft（既存） =====
      var blockId = params.get('blockId');
      var spaceId = params.get('spaceId');
      if (blockId && spaceId) {
        var craftUrl = 'craftdocs://open?blockId=' + blockId + '&spaceId=' + spaceId;
        btn.href = craftUrl;
        btn.textContent = 'Craftで開く';
        desc.textContent = 'タップしてCraftのメモを開きます';
      }
    } else if (scheme === 'plaud') {
      // ===== PLAUD（新規） =====
      var pid = params.get('id');
      var ptitle = params.get('t') || '';
      var webUrl = 'https://web.plaud.ai/file/' + pid;
      // PLAUDは録音単位のアプリ用ディープリンクを公開していないため、アプリは plaud:// で起動（ファイル一覧）。
      // スマホではタイトルをクリップボードにコピーし、アプリ内検索で目的の録音へ到達させる。
      var appUrl = 'plaud://';
      var ua = navigator.userAgent || '';
      var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
      document.getElementById('icon').textContent = '🎙️';
      if (isMobile) {
        // スマホ: タイトルをコピー → PLAUDアプリ起動（アプリ内検索で目的の録音へ）
        btn.className = 'btn plaud';
        btn.href = appUrl;
        btn.textContent = 'PLAUDアプリで開く';
        if (ptitle) {
          desc.innerHTML = 'タップでPLAUDアプリが開きます。<br>アプリ右上の検索に貼り付けるとこの録音が出ます：<br><b style="color:#1f2a30">' + ptitle + '</b>';
          sub.innerHTML = '（タイトルは自動コピーされます） / <a href="' + webUrl + '">web版で開く</a>';
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ptitle);
              }
            } catch (err) {}
            setTimeout(function () { window.location.href = appUrl; }, 150);
          });
        } else {
          desc.textContent = 'タップしてPLAUDアプリを開きます';
          sub.innerHTML = 'アプリが開かない場合は <a href="' + webUrl + '">web版で開く</a>';
        }
      } else {
        // PC: その録音のweb版へ自動遷移
        btn.className = 'btn plaud';
        btn.href = webUrl;
        btn.textContent = 'PLAUDを開く';
        desc.textContent = 'PLAUD（web）を開いています…';
        window.location.replace(webUrl);
      }
    } else {
      // ===== Apple Notes（既存・デフォルト） =====
      var id = params.get('id');
      if (id) {
        btn.href = 'applenotes://showNote?identifier=' + id;
        btn.textContent = 'メモを開く';
        desc.textContent = 'タップしてApple Notesのメモを開きます';
      }
    }
  </script>
</body>
</html>
