<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メモを開く</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f7; }
    .container { text-align: center; padding: 40px; }
    .btn { display: inline-block; padding: 16px 40px; font-size: 18px; color: white; background: #007AFF; border-radius: 12px; text-decoration: none; margin: 20px 0; }
    .btn:active { background: #005EC4; }
    p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <p>📝</p>
    <a id="openBtn" class="btn" href="#">メモを開く</a>
    <p>タップしてApple Notesのメモを開きます</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var scheme = params.get('scheme');
    if (scheme === 'craft') {
      var blockId = params.get('blockId');
      var spaceId = params.get('spaceId');
      if (blockId && spaceId) {
        var craftUrl = 'craftdocs://open?blockId=' + blockId + '&spaceId=' + spaceId;
        document.getElementById('openBtn').href = craftUrl;
        document.getElementById('openBtn').textContent = 'Craftで開く';
      }
    } else {
      var id = params.get('id');
      if (id) {
        document.getElementById('openBtn').href = 'applenotes://showNote?identifier=' + id;
      }
    }
  </script>
</body>
</html>
